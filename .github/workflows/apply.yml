name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'apply or destroy'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy
      confirmation:
        description: 'Type workloads-dev after reviewing the target account and action'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: inputs.confirmation == 'workloads-dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    environment: aws-workloads-dev

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: Configure AWS credentials (mgmt OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Confirm mgmt identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform ${{ inputs.action }}
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform destroy -input=false -auto-approve -no-color
          else
            terraform apply -input=false -auto-approve -no-color
          fi

      - name: Summarize outputs
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Apply outputs"
            echo ''
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
