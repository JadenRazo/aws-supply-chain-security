name: supply-chain

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full 40-character commit SHA from JadenRazo/sre-reference-app'
        required: true
        type: string
      mode:
        description: 'gate = fail-build at HIGH+ (production default); demo = scan+report only, sign+verify still run'
        required: true
        default: 'gate'
        type: choice
        options:
          - gate
          - demo
permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: supply-chain-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: JadenRazo/sre-reference-app
  WORKLOADS_DEV_ACCOUNT_ID: '422783588447'

jobs:
  build-sign-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: aws-workloads-dev

    steps:
      - name: Checkout this repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate immutable source ref
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout source app (sre-reference-app)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref }}
          path: source

      - name: Configure AWS credentials (mgmt OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Assume workloads-dev role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ env.WORKLOADS_DEV_ACCOUNT_ID }}:role/OrganizationAccountAccessRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: supply-chain-${{ github.run_id }}
          role-chaining: true

      - name: Confirm workloads-dev identity
        run: aws sts get-caller-identity

      - name: Login to ECR (workloads-dev)
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Compute image tag
        id: tag
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          echo "tag=${SOURCE_REF:0:12}" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image (local load — pre-scan)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: source/app
          file: source/app/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tag.outputs.uri }}:${{ steps.tag.outputs.tag }}

      - name: Generate SBOM (syft, SPDX JSON)
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.tag.outputs.uri }}:${{ steps.tag.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention-days: 30

      # only-fixed=true is the production-grade default: fail builds on
      # vulnerabilities the upstream package has actually shipped a fix for.
      # Vulns without a fix are pending vendor work and breaking the build on
      # them just creates noise. Severity gate stays at HIGH+.
      - name: Vulnerability scan (grype, fail at HIGH+ with fixes available)
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.tag.outputs.uri }}:${{ steps.tag.outputs.tag }}
          severity-cutoff: high
          only-fixed: true
          fail-build: ${{ inputs.mode != 'demo' }}
          output-format: sarif

      - name: Upload SARIF to GitHub code scanning
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

      - name: Push image to ECR
        run: |
          docker push "${{ steps.tag.outputs.uri }}:${{ steps.tag.outputs.tag }}"
          DIGEST=$(docker inspect "${{ steps.tag.outputs.uri }}:${{ steps.tag.outputs.tag }}" \
            --format '{{ index .RepoDigests 0 }}' | cut -d@ -f2)
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${{ steps.tag.outputs.uri }}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes "${IMAGE_REF}"

      - name: Verify signature
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/\.github/workflows/supply-chain\.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Supply chain pipeline"
            echo ''
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_REF:-(failed before push)}\` |"
            echo "| SBOM | uploaded as artifact (\`sbom.spdx.json\`) |"
            echo "| Vuln scan | grype, fail-at HIGH+ |"
            echo "| Signature | keyless cosign, verified against workflow OIDC identity |"
            echo "| Source | \`${SOURCE_REPO}@${{ inputs.source_ref }}\` |"
            echo "| Mode | \`${{ inputs.mode || 'gate' }}\` (gate = fail-build at HIGH+; demo = report-only) |"
          } >> "$GITHUB_STEP_SUMMARY"
